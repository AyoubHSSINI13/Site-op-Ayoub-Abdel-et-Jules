<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Embarquez pour l'aventure One Piece ! Choisissez votre avis de recherche et découvrez les secrets de la Marine, des Pirates et des Fruits du Démon.">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="preload" href="images/imgHome/homeBackground.webp" as="image">
    <link rel="preload" href="images/imgHome/woodenSign.webp" as="image">
    <title>One Piece</title>
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/csshome.css">
</head>
<body>
    <!-- Grain overlay for texture -->
    <div class="grain"></div>

    <div class="header">
        <img src="images/imgHome/logoOp.webp" id="op" alt="Logo One Piece">
    </div>

    <div class="woodenSign">
        <img src="images/imgHome/woodenSign.webp" id="woodenSign" alt="Panneau en bois">

        <div class="affiches" id="affiches">
            <a href="html/marinevspirates.html" title="Voir les personnages" class="affiche-link">
                <img id="personnages" src="images/imgHome/characters.webp" alt="Personnages">
                <span class="affiche-label">Personnages</span>
            </a>
            <a href="html/diverse.html" title="Voir la section divers" class="affiche-link">
                <img id="divers" src="images/imgHome/diverse.webp" alt="Divers">
                <span class="affiche-label">Divers</span>
            </a>
            <a href="html/power.html" title="Voir les pouvoirs" class="affiche-link">
                <img src="images/imgHome/power.webp" alt="Pouvoirs" id="power">
                <span class="affiche-label">Pouvoirs</span>
            </a>
        </div>
    </div>
</body>
</html>
