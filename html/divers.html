<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cssdivers.css">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>Document</title>
</head>
<body>
    <div class="container">
        <div class="titre" style="grid-area: box-1">
    <h1>Qu'en pensez-vous ?</h1>
    </div>
    <div class="input-box" style="grid-area: box-2">
    <input type="text" name="email" class="email" placeholder="Votre e-mail :">
    </div>
    <div class="input-box" style="grid-area: box-3">
    <input type="text" name="nom" class="nom" placeholder="Votre nom :">
    </div>
    <div class="input-box" style="grid-area: box-4">
    <input type="text" name="prenom" class="prenom" placeholder="Votre prenom :">
    </div>
    <div class="input-box" rows="6" style="grid-area: box-5" id="a">
    <input type="text" name="avis" class="avis" placeholder="Quel est votre avis :">
    </div>
    </div>
    <div class="btn">
    <input type="Submit" value="Envoyer">
    </div>
    
</body>
</html>
