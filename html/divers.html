<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/cssdivers.css">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-src https://www.youtube-nocookie.com;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <title>One Piece - Rejoins l'équipage</title>
</head>
<body>

    <div class="logpose-wrapper">
        <a href="/index.html" class="logpose-btn">
            <span class="logpose-text">Accueil</span>
            <img src="/images/ImagesDivers/Boussole.webp" alt="Log Pose" class="logpose-icon">
        </a>
    </div>

    <div class="container-pirate">

     <div class="video-section">
    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube-nocookie.com/embed/JMwp0-0cBGQ?autoplay=1&mute=1&controls=0&playsinline=1&loop=1&playlist=JMwp0-0cBGQ" 
        title="L'exécution de Gol D. Roger" 
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
        allowfullscreen>
    </iframe>
    </div>

       <div class="inscription-form-container">
    <form action="mailto:ayoub.hssini@etu.univ-amu.fr" method="post" enctype="text/plain" class="transparent-form">
        
        <input type="hidden" name="Sujet" value="Nouvelle Inscription / Avis Site One Piece">

        <h2>Rejoins l'aventure !</h2>

        <div class="input-group">
            <label for="pseudo">Pseudo :</label>
            <input type="text" id="pseudo" name="user_pseudo" required placeholder="Monkey D. Luffy">
        </div>

        <div class="input-group">
            <label for="email">Email :</label>
            <input type="email" id="email" name="user_email" required placeholder="roi.des.pirates@grandline.com">
        </div>

        <div class="faction-choice-container">
            <p class="faction-title">Choisis ton camp :</p>
            <div class="faction-options">
                <label class="faction-label pirate-option">
                    <input type="radio" name="faction" value="pirate" checked>
                    <span class="faction-custom-radio">☠️ Pirate</span>
                </label>
                <label class="faction-label marine-option">
                    <input type="radio" name="faction" value="marine">
                    <span class="faction-custom-radio">⚓ Marine</span>
                </label>
            </div>
        </div>

        <button type="submit" class="submit-btn">S'inscrire</button>
    </form>
</div>

    </div> </body>
</html>
